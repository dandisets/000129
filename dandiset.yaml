description: This dataset contains sorted unit spiking times and behavioral data from
  a Macaque rhesus performing a self-paced reaching task, used to demonstrate superior
  arm-movement decoding with a new, unsupervised-learning algorithm. In the experimental
  task, the subject reached between targets randomly selected from an 8x8 grid without
  gaps or pre-movement delay intervals. Neural activity was recorded from an electrode
  array implanted in the primary motor cortex. Finger position, cursor position, and
  target position were also recorded. Provided as part of the Neural Latents Benchmark
  (https://neurallatents.github.io) and described in Makin et al. (2018).
